name: hikmah
services:
  app:
    image: ${HIKMAH_IMAGE:?Set the immutable image tag}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HIKMAH_DATA_DIR: /data
      HIKMAH_SEARCH_URL: ${HIKMAH_SEARCH_URL:-http://search:8080/search}
    depends_on:
      search: {condition: service_started}
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=1000,gid=1000
      - /app/.next/cache:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 256
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  search:
    image: ${HIKMAH_SEARCH_IMAGE:-docker.io/searxng/searxng:latest}
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${HIKMAH_SEARCH_SECRET:?Search secret is generated by configure.py}
      SEARXNG_SETTINGS_PATH: /etc/searxng/hikmah.yml
    configs:
      - source: search_settings
        target: /etc/searxng/hikmah.yml
    # Accessible only on the Compose network; the authenticated app owns requests.
    mem_limit: 512m
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      HIKMAH_DOMAIN: ${HIKMAH_DOMAIN:?Set the HTTPS domain}
    depends_on:
      app: {condition: service_healthy}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  caddy_data:
  caddy_config:
configs:
  search_settings:
    content: |
      use_default_settings: true
      search:
        formats: [html, json]
      server:
        limiter: false
        public_instance: false
      outgoing:
        request_timeout: 8.0
        max_request_timeout: 12.0
