name: hikmah
services:
  app:
    image: ${HIKMAH_IMAGE:?Set the immutable image tag}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HIKMAH_DATA_DIR: /data
      HIKMAH_SEARCH_URL: ${HIKMAH_SEARCH_URL:-http://search:8080/search}
      HIKMAH_WORKBENCH_URL: ${HIKMAH_WORKBENCH_URL:-http://workbench:3001}
    depends_on:
      search: { condition: service_started }
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=1000,gid=1000
      - /app/.next/cache:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
  search:
    image: ${HIKMAH_SEARCH_IMAGE:-docker.io/searxng/searxng:latest}
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${HIKMAH_SEARCH_SECRET:?Search secret is generated by configure.py}
      SEARXNG_SETTINGS_PATH: /etc/searxng/hikmah.yml
    configs:
      - source: search_settings
        target: /etc/searxng/hikmah.yml
    # Accessible only on the Compose network; the authenticated app owns requests.
    mem_limit: 512m
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '2' }
  workbench:
    # The execution sidecar: the terminal, SSH and the assistant's shell tools.
    # It is a separate container because the app is read-only with every
    # capability dropped, and because a command that misbehaves must not be able
    # to reach the app's data volume or its secrets.
    image: ${HIKMAH_WORKBENCH_IMAGE:?Set the immutable workbench image tag}
    restart: unless-stopped
    init: true
    # No env_file, unlike the app: .env holds the vault key and the session
    # secret, and this service hands people a shell. It gets the two values it
    # actually needs, interpolated from .env by the compose command itself.
    environment:
      HIKMAH_WORKBENCH_TOKEN: ${HIKMAH_WORKBENCH_TOKEN:?Generated by configure.py}
      HIKMAH_APP_ORIGIN: https://${HIKMAH_DOMAIN:?Set the HTTPS domain}
      HIKMAH_WORKSPACE_DIR: /workspace
    volumes:
      - ./workbench-data:/workspace
    # Not read_only: the point of this service is a workspace people write to.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      HIKMAH_DOMAIN: ${HIKMAH_DOMAIN:?Set the HTTPS domain}
    depends_on:
      app: { condition: service_healthy }
      # Started, not healthy: a sidecar that fails to come up must cost the
      # owner their terminal, not their whole site.
      workbench: { condition: service_started }
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
volumes:
  caddy_data:
  caddy_config:
configs:
  search_settings:
    content: |
      use_default_settings: true
      search:
        formats: [html, json]
      server:
        limiter: false
        public_instance: false
      outgoing:
        request_timeout: 8.0
        max_request_timeout: 12.0
