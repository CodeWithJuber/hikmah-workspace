name: CLA
# Asks every pull request author to sign CLA.md once, and records the
# signature in the cla-signatures branch of this repository.
#
# pull_request_target runs this file from the default branch with a write
# token, so it must never check out or run code from the pull request. It
# only reads the PR's metadata and comments; scripts/check-workflow-isolation.mjs
# fails the build if a checkout of PR code is ever added here.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
permissions:
  contents: read
jobs:
  cla:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.user.login != 'CodeWithJuber') ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/CodeWithJuber/hikmah-workspace/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          # Not protected, and separate from main so signing never touches code.
          branch: cla-signatures
          allowlist: CodeWithJuber,*[bot]
          lock-pullrequest-aftermerge: false
