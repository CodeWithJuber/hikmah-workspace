name: Verify and deploy Hikmah
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hikmah-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  auto-format:
    # Permanent fix for repeated `format:check` failures: on every PR from this
    # repo, prettier auto-fixes the branch and pushes the fix back, so a
    # formatting slip can never block the pipeline again. Self-terminating:
    # the follow-up run finds a clean tree and pushes nothing, so there is no
    # push loop. The strict `format:check` in `verify` stays as the backstop.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, hikmah-prod]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - name: Auto-fix formatting with prettier
        run: |
          npx prettier --write .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: auto-format with prettier"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
            echo "Pushed formatting fixes; a fresh run will verify the fixed tree."
          else
            echo "Formatting already clean."
          fi
  # Fast static checks: format, lint, design tokens, reachability. Fails fast
  # so a style slip never waits for the full test suite.
  checks:
    runs-on: [self-hosted, hikmah-prod]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run lint:styles
      # The palette is generated and committed; this fails when the two drift.
      - run: npm run design:check
      # A feature that loses its only caller breaks the build here rather than
      # going quiet for a month. See scripts/check-reachable.mjs.
      - run: npm run lint:reach
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
  # Unit + integration tests. Runs in parallel with `checks`; both must pass
  # before the build starts.
  tests:
    runs-on: [self-hosted, hikmah-prod]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      # PR fast path: run only tests impacted by the changed files.
      # scripts/impacted-tests.mjs is fail-safe: on any error or when a
      # full-suite trigger (package.json, .github/, etc.) is touched, it
      # outputs [] and we fall back to the full suite below.
      - name: Compute impacted tests
        id: impacted
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=100 2>/dev/null || true
          TESTS=$(node scripts/impacted-tests.mjs --from-git "origin/${{ github.base_ref }}" 2>/dev/null || echo '[]')
          echo "tests=${TESTS}" >> "$GITHUB_OUTPUT"
          echo "Impacted tests: ${TESTS}"
      - name: Run impacted tests (PR fast path)
        if: github.event_name == 'pull_request' && steps.impacted.outputs.tests != '' && steps.impacted.outputs.tests != '[]'
        run: |
          TESTS='${{ steps.impacted.outputs.tests }}'
          MAIN=$(echo "$TESTS" | python3 -c 'import json,sys; print(" ".join(t for t in json.load(sys.stdin) if t.startswith("tests/")))')
          if [ -n "$MAIN" ]; then
            echo "Running impacted main tests: $MAIN"
            node --test $MAIN
          else
            echo "No impacted main tests."
          fi
      - name: Run full test suite
        # Main pushes always run the full suite. PRs fall back here when the
        # impacted-tests script outputs [] (full-suite trigger or error).
        if: github.event_name != 'pull_request' || steps.impacted.outputs.tests == '' || steps.impacted.outputs.tests == '[]'
        run: npm test
      - run: python3 -m unittest discover -s public/runtime -p 'test_*.py'
      - run: python3 -m unittest discover -s deploy -p 'test_*.py'
      - run: bash -n deploy/bootstrap.sh deploy/release.sh deploy/from-actions.sh scripts/smoke-container.sh scripts/smoke-workbench.sh
      # The workbench is a separate package with its own dependencies, so it is
      # verified separately. A broken sidecar means no terminal and no SSH.
      - run: npm ci --ignore-scripts
        working-directory: workbench
      - name: Run workbench tests (impacted on PR, full on main)
        working-directory: workbench
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TESTS=$(node ../scripts/impacted-tests.mjs --from-git "origin/${{ github.base_ref }}" 2>/dev/null || echo '[]')
            WB=$(echo "$TESTS" | python3 -c 'import json,sys; print(" ".join(t.split("/",1)[1] for t in json.load(sys.stdin) if t.startswith("workbench/")))')
            if [ -n "$WB" ]; then
              echo "Running impacted workbench tests: $WB"
              npm run typecheck && node --test $WB && npm audit --omit=dev --audit-level=high
              exit 0
            fi
            echo "No impacted workbench tests; running full workbench suite."
          fi
          npm run typecheck && npm test && npm audit --omit=dev --audit-level=high
  # Build + container verification. Needs both checks and tests green.
  # The two docker builds run in parallel via shell background jobs.
  build:
    needs: [checks, tests]
    runs-on: [self-hosted, hikmah-prod]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      # A Caddyfile that fails to parse takes the whole site down, and the error
      # would otherwise appear for the first time on the server.
      # The domain is passed into the container, not just to the step: without
      # it the site address is empty and Caddy reads the block as global
      # options, which fails for a reason that has nothing to do with the file.
      - run: docker run --rm -e HIKMAH_DOMAIN=hikmah.invalid -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      # Stages the standalone build in an isolated directory, signs in, rejects
      # spoofed identities and cross-origin writes, restarts the process and
      # re-reads the saved session. It existed but was never wired into CI.
      - run: npm run build && npm run test:production
      - name: Build immutable images (parallel)
        run: |
          docker build --pull --build-arg HIKMAH_BUILD_ID="$GITHUB_SHA" --tag "hikmah-workspace:$GITHUB_SHA" . &
          PID1=$!
          docker build --pull --build-arg HIKMAH_BUILD_ID="$GITHUB_SHA" --tag "hikmah-workbench:$GITHUB_SHA" workbench &
          PID2=$!
          wait $PID1 || { echo "main image build failed"; exit 1; }
          wait $PID2 || { echo "workbench image build failed"; exit 1; }
          echo "Both images built."
      - name: Smoke tests (parallel)
        run: |
          bash scripts/smoke-workbench.sh "hikmah-workbench:$GITHUB_SHA" &
          PID1=$!
          SMOKE_REVISION="${{ github.sha }}" bash scripts/smoke-container.sh "hikmah-workspace:$GITHUB_SHA" &
          PID2=$!
          wait $PID1 || { echo "workbench smoke failed"; exit 1; }
          wait $PID2 || { echo "container smoke failed"; exit 1; }
          echo "Both smoke tests passed."
        env:
          SMOKE_REVISION: ${{ github.sha }}
      - name: Package the verified image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
        run: |
          mkdir artifact
          docker save "hikmah-workspace:$GITHUB_SHA" | gzip -1 > artifact/image.tar.gz
          docker save "hikmah-workbench:$GITHUB_SHA" | gzip -1 > artifact/workbench.tar.gz
          cd artifact
          sha256sum image.tar.gz workbench.tar.gz > image.sha256
      - name: Cache verified image for deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: artifact/
          key: hikmah-image-${{ github.sha }}-${{ github.run_id }}
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    # Same self-hosted runner: the deploy lands from the machine it runs on.
    # DEPLOY_HOST should be the server's own address (SSH to self).
    runs-on: [self-hosted, hikmah-prod]
    timeout-minutes: 20
    environment: test-server
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - name: Restore verified image
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: artifact/
          key: hikmah-image-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Prepare SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Deploy the verified image and check HTTPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          HIKMAH_DOMAIN: ${{ vars.HIKMAH_DOMAIN }}
          HIKMAH_OWNER_EMAIL: ${{ secrets.HIKMAH_OWNER_EMAIL }}
          HIKMAH_SESSION_SECRET: ${{ secrets.HIKMAH_SESSION_SECRET }}
          HIKMAH_OWNER_PASSWORD: ${{ secrets.HIKMAH_OWNER_PASSWORD }}
        run: bash deploy/from-actions.sh
