name: Verify and build Hikmah
# The UNTRUSTED workflow: it runs PR-supplied code (pull_request trigger), so
# it must never see production credentials. No `secrets.*` reference (other
# than the per-run GITHUB_TOKEN) may appear in this file — enforced by
# scripts/check-workflow-isolation.mjs, which runs in the `checks` job below.
# Deployment lives in deploy.yml, which only ever runs this workflow's
# definition from the default branch.
#
# Every job runs on a standard GitHub-hosted runner. A public repository must
# never use a self-hosted runner: a pull request from anyone could run code on
# that machine. The same script fails the build on a self-hosted or larger
# runner.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hikmah-${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request supersedes the older run; runs on main
  # always finish, because deploy.yml acts on them.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  auto-format:
    # On a pull request from a branch of THIS repository (never a fork, never
    # Dependabot, whose token is read-only), prettier fixes the branch and
    # pushes the fix back. The strict `format:check` in `checks` stays as the
    # backstop: a push made with GITHUB_TOKEN does not start a new run, so push
    # an empty commit or re-run the checks to verify the fixed tree.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', package-manager-cache: false }
      - run: npm ci --ignore-scripts
      - name: Auto-fix formatting with prettier
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          npx prettier --write .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: auto-format with prettier"
            git push origin "HEAD:${HEAD_REF}"
            echo "Pushed formatting fixes."
          else
            echo "Formatting already clean."
          fi
  # Fast static checks: workflow rules, format, lint, design tokens,
  # reachability, types. Fails fast so a style slip never waits for the suite.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', package-manager-cache: false }
      - run: npm ci --ignore-scripts
      # Workflow gate: no production secrets in this untrusted workflow,
      # deploy.yml pinned to the verified SHA behind the protected production
      # environment, every action pinned to a commit, only standard
      # GitHub-hosted runners, and no pull_request_target checkout of PR code.
      - run: node scripts/check-workflow-isolation.mjs
      - run: npm run format:check
      - run: npm run lint
      - run: npm run lint:styles
      # The palette is generated and committed; this fails when the two drift.
      - run: npm run design:check
      # A feature that loses its only caller breaks the build here rather than
      # going quiet for a month. See scripts/check-reachable.mjs.
      - run: npm run lint:reach
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
  # Every file must state its licence (REUSE.toml, LICENSES/).
  licensing:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
  # Secret scanning with gitleaks: the commits a pull request adds, the
  # commits a push adds, or the whole history on a manual run.
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan for secrets
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push)
              if [[ $PUSH_BEFORE =~ ^0+$ ]] || ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                range=HEAD
              else
                range="$PUSH_BEFORE..$GITHUB_SHA"
              fi ;;
            *) range=HEAD ;;
          esac
          echo "Scanning $range"
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --config .gitleaks.toml --log-opts="$range" .
  # Licence and vulnerability review of the dependencies a pull request adds.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
  # Unit + integration tests. Runs in parallel with `checks`; both must pass
  # before the build starts.
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', package-manager-cache: false }
      - run: npm ci --ignore-scripts
      # Check the exact artifact/SSH/release handoff even when an unrelated
      # application test later fails. The rehearsal uses only temporary files.
      - run: python3 -m unittest discover -s deploy -p 'test_deploy_transfer.py'
      # PR fast path: smart test selection.
      # scripts/smart-test-select.mjs tiers the change (cosmetic/low/medium/high)
      # using deterministic signals first, then optional forge impact / LLM /
      # JEV for the ambiguous middle. Fail-safe: any uncertainty -> high tier
      # -> full suite. Cosmetic tier skips unit tests (lint already passed).
      - name: Smart test selection
        id: smart
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=100 2>/dev/null || true
          SEL=$(node scripts/smart-test-select.mjs --from-git "origin/$BASE_REF" 2>/dev/null || echo '{"tier":"high","tests":[]}')
          echo "$SEL" | python3 -c "import json,sys; d=json.load(sys.stdin); print('tier='+d.get('tier','high')); print('reason='+d.get('reason',''))"
          TIER=$(echo "$SEL" | python3 -c "import json,sys; print(json.load(sys.stdin).get('tier','high'))")
          TESTS=$(echo "$SEL" | python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin).get('tests',[])))")
          echo "tier=${TIER}" >> "$GITHUB_OUTPUT"
          echo "tests=${TESTS}" >> "$GITHUB_OUTPUT"
          echo "Tier: ${TIER}"
      - name: Run selected tests (PR fast path)
        if: github.event_name == 'pull_request' && steps.smart.outputs.tier != 'high' && steps.smart.outputs.tier != 'cosmetic'
        env:
          TESTS: ${{ steps.smart.outputs.tests }}
          TIER: ${{ steps.smart.outputs.tier }}
        run: |
          MAIN=$(echo "$TESTS" | python3 -c 'import json,sys; print(" ".join(t for t in json.load(sys.stdin) if t.startswith("tests/")))')
          if [ -n "$MAIN" ]; then
            echo "Running selected main tests (tier=$TIER): $MAIN"
            node --test $MAIN
          else
            echo "No selected main tests."
          fi
      - name: Run full test suite
        # Main pushes always run the full suite. PRs fall back here on high tier
        # (full-suite trigger, large blast radius, or any uncertainty).
        if: github.event_name != 'pull_request' || steps.smart.outputs.tier == 'high' || steps.smart.outputs.tier == ''
        run: npm test
      - run: python3 -m unittest discover -s public/runtime -p 'test_*.py'
      - run: python3 -m unittest discover -s deploy -p 'test_*.py'
      - run: bash -n deploy/bootstrap.sh deploy/release.sh deploy/from-actions.sh scripts/smoke-container.sh scripts/smoke-workbench.sh
      # The workbench is a separate package with its own dependencies, so it is
      # verified separately. A broken sidecar means no terminal and no SSH.
      - run: npm ci --ignore-scripts
        working-directory: workbench
      - name: Run workbench tests (selected on PR, full on main)
        working-directory: workbench
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            SEL=$(node ../scripts/smart-test-select.mjs --from-git "origin/$BASE_REF" 2>/dev/null || echo '{"tier":"high","tests":[]}')
            TIER=$(echo "$SEL" | python3 -c "import json,sys; print(json.load(sys.stdin).get('tier','high'))")
            if [ "$TIER" = "high" ] || [ "$TIER" = "cosmetic" ]; then
              echo "Tier ${TIER}: running full workbench suite."
            else
              WB=$(echo "$SEL" | python3 -c 'import json,sys; print(" ".join(t.split("/",1)[1] for t in json.load(sys.stdin).get("tests",[]) if t.startswith("workbench/")))')
              if [ -n "$WB" ]; then
                echo "Running selected workbench tests (tier=${TIER}): $WB"
                npm run typecheck && node --test $WB && npm audit --omit=dev --audit-level=high
                exit 0
              fi
              echo "No selected workbench tests; running full workbench suite."
            fi
          fi
          npm run typecheck && npm test && npm audit --omit=dev --audit-level=high
  # Build + container verification. Needs both checks and tests green.
  # The two docker builds run in parallel via shell background jobs.
  build:
    needs: [checks, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', package-manager-cache: false }
      - run: npm ci --ignore-scripts
      # A Caddyfile that fails to parse takes the whole site down, and the error
      # would otherwise appear for the first time on the server.
      # The domain is passed into the container, not just to the step: without
      # it the site address is empty and Caddy reads the block as global
      # options, which fails for a reason that has nothing to do with the file.
      - run: docker run --rm -e HIKMAH_DOMAIN=hikmah.invalid -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      # Stages the standalone build in an isolated directory, signs in, rejects
      # spoofed identities and cross-origin writes, restarts the process and
      # re-reads the saved session.
      - run: npm run build && npm run test:production
      - name: Build immutable images (parallel)
        run: |
          docker build --pull --build-arg HIKMAH_BUILD_ID="$GITHUB_SHA" --tag "hikmah-workspace:$GITHUB_SHA" . &
          PID1=$!
          docker build --pull --build-arg HIKMAH_BUILD_ID="$GITHUB_SHA" --tag "hikmah-workbench:$GITHUB_SHA" workbench &
          PID2=$!
          wait $PID1 || { echo "main image build failed"; exit 1; }
          wait $PID2 || { echo "workbench image build failed"; exit 1; }
          echo "Both images built."
      - name: Smoke tests (parallel)
        run: |
          bash scripts/smoke-workbench.sh "hikmah-workbench:$GITHUB_SHA" &
          PID1=$!
          SMOKE_REVISION="$GITHUB_SHA" bash scripts/smoke-container.sh "hikmah-workspace:$GITHUB_SHA" &
          PID2=$!
          wait $PID1 || { echo "workbench smoke failed"; exit 1; }
          wait $PID2 || { echo "container smoke failed"; exit 1; }
          echo "Both smoke tests passed."
      # The deploy workflow (deploy.yml) is only allowed to deploy this exact
      # commit, so the verified SHA travels with the images it verified, with
      # their checksums. deploy.yml confirms provenance.json and the checksums
      # before touching any credential. Only main runs with deploys switched on
      # keep the images, and only for a day.
      - name: Package the verified images
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
        run: |
          mkdir artifact
          docker save "hikmah-workspace:$GITHUB_SHA" | gzip -1 > artifact/image.tar.gz
          docker save "hikmah-workbench:$GITHUB_SHA" | gzip -1 > artifact/workbench.tar.gz
          cd artifact
          python3 -c "import json,os; json.dump({'sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'repository': os.environ['GITHUB_REPOSITORY']}, open('provenance.json','w'))"
          sha256sum image.tar.gz workbench.tar.gz provenance.json > image.sha256
      - name: Keep the verified images for the deploy workflow
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hikmah-images
          path: artifact/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
